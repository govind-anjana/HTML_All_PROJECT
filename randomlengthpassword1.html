<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .containtor{
        height:97vh;
        background-color:silver;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .main{
        width:50vh;
        height:auto;
        border:2px solid red;
        padding:15px;
    }
    input[type="text"],input[type="button"]{
        width:90%;
        height:auto;
        font-size: 20px;
        padding:3px 5px;
        cursor: pointer;
    }
    input[type="number"]{
        width:10%;
        padding:3px 5px;
        font-size: 16px;
    }
    label{
        line-height: 30px;
        font-size: 20px;
    }
    input[type="checkbox"]{
        width:20px;
        height:20px;
        margin:10px 10px 0 ;
    }
</style>
<body>
    <div class="containtor">
        <div class="main">
            <input type="text" readonly id="ans">
            <input type="number" id="len" value="10" min="2" max="20"><label for="num">Password Length</label><br>
            <input type="checkbox" id="upp"><label for="upp">Text is Uppercase</label><br>
            <input type="checkbox" id="low"><label for="low">Text is Lowercase</label><br>
            <input type="checkbox" id="num" ><label for="num">Text is Number</label><br>
            <input type="checkbox" id="sym"><label for="num">Text is Symbol</label><br>
            
            
              <input type="button" id="button" value="Submit"> 
        </div>
    </div>
</body>
<script>
    const uppercase="QWERTYUIOPASDFGHJKLZXCVNM";
    const lowercase="qwertyuiopasdfghjklzxcvnm";
    const number="1234567890";
    const symbol="!@#$%^&*()_{}|";

    const upp=document.getElementById("upp");
    const low=document.getElementById("low");
    const num=document.getElementById("num");
    const sym=document.getElementById("sym");
    const len=document.getElementById("len");
    const ans=document.getElementById("ans");

    const getRandomdata=(dataset)=>{
        return dataset[Math.floor(Math.random()*dataset.length)];
    }
    const generatePassword=(password="")=>{
        if(upp.checked){
            password +=getRandomdata(uppercase);
        }
        if(low.checked){
            password +=getRandomdata(lowercase);
        }
        if(num.checked){
            password +=getRandomdata(number);
        }
        if(sym.checked){
            password +=getRandomdata(symbol);
        }
        if(password.length < len.value){
            return generatePassword(password);
        }
         ans.value=(tranctstring(password,len.value));
    }
    function tranctstring(pass,num){
        if(pass.length>num){
           let substr=pass.substring(0,num);
            return substr;
        }
        else{
            return substr;
        }
    }
    const btn= document.getElementById("button");
        btn.addEventListener("click",()=>{
             generatePassword();

        })
</script>
</html>
