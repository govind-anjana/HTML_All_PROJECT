<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .container{
            border:3px solid Red;
        }
        input[type="range"]{
            accent-color: red;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12 py-3 text-center font-weight-bold">Bootstrap 4 Custorm Class</div>
            <div class="col-md-6">
                <div class="form-group">
                    <select class="custom-select">
                        <option>Open this Selct menu</option>
                        <option>Govind</option>
                        <option>Anjana</option>
                        <option>Patel</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Example range</label>
                    <input type="range" class="custom-range">
                </div>
                <div class="form-inline my-4">
                    <div class="form-group">
                    <input type="text" class="form-control" placeholder="User Name"><br>
                     <label class="form-control-plaintext text-success">Looks</label>           
                </div>
                    <div class="form-group mr-auto">
                    <input type="password" class="form-control" placeholder="User Name">
                     <label class="form-control-plaintext text-warning">Place provi</label>      
                </div>
            </div>
            <div class="form-inline">
                <input type="text" placeholder="User Name" class="form-control">
                <input type="text" placeholder="Password" class="form-control mx-3">
                <button class="btn-primary btn-sm">Login</button>
            </div>
        </div>
        <div class="col-md-6">
            <div class="custom-file">
                 <input type="file" class="custom-file-input">
                 <label class="custom-file-label">Choose File</label>
            </div>
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="checkbox1">
                <label for="checkbox1" class="custom-control-label">Sport</label>
            </div>
            <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="checkbox2">
            <label for="checkbox2" class="custom-control-label">Dans</label>
            </div>
            <div class="custom-control custom-checkbox">
         <input type="checkbox" class="custom-control-input" id="checkbox3">
                <label for="checkbox3" class="custom-control-label">Music</label>
            </div>
            <div class="custom-control custom-switch">
         <input type="checkbox" class="custom-control-input" id="checkbox4">
                <label for="checkbox4" class="custom-control-label">Music</label>
            </div>
        </div>
    </div>
    <div class="row py-3">
        <div class="col">
            <div class="form-inline">
                <div class="form-group">
                    <label class="sr-only">UserName</label>
                    <input type="text" placeholder="UserName" class="form-control form-control-sm is-valid">
                     <div class="valid-feedback">Looks Good!</div>
                </div>
                <div class="form-group mx-4">
                    <label class="sr-only">Password</label>
                    <input type="text"  placeholder="Password" class="form-control form-control-sm is-invalid">
                    <div class="invalid-feedback">Enter valid password</div>
                </div>
                <button class="btn btn-primary btn-sm">Login</button>
                </div>
        
        </div>
    </div>
    <div class="row py-5">
        <div class="col">
              <div class="form-inline">
         <div class="form-group">
            <label class="sr-only">UserName</label>
            <input type="text" class="form-control is-valid">
             <div class="valid-tooltip">Looks Good!</div>
        </div>
        <div class="form-group">
            <label class="sr-only">Password</label>
            <input type="text" class="form-control is-invalid">
            <div class="invalid-tooltip">Looks Good!</div>
        </div>
    </div> 
        </div>
    </div>
    </div>

</body>
</html>
