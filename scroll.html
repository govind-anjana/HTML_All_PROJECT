<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            
        }
        :root{
            --w:250px;
        }
        .wrapper{
            width:90%;
            height:250px;
            padding:10px;
            /* border:2px solid black; */
            position: relative;
          /* box-sizing: border-box; */
            overflow: hidden;
            margin: auto;
        }
        .box{
            width:var(--w);
            height:200px;
            left: calc(var(--w) * 8);
            /* display: flex; */
            background-color: red;
            /* float: left; */
            /* border:2px solid black; */
            border-radius:10px;
            position: absolute;
            box-shadow: 0px 0px 5px 5px silver;
            /* left:100%; */
            overflow: hidden;
            animation: scroll 30s linear infinite;
        }
img{
width:100%;
height:100%;
background-size: cover;

}

        .a1{ animation-delay: calc(30s / 8 * (8 - 1) * -1); }
        .a2{ animation-delay: calc(30s / 8 * (8 - 2) * -1); }
        .a3{ animation-delay: calc(30s / 8 * (8 - 3) * -1); }
        .a4{ animation-delay: calc(30s / 8 * (8 - 4) * -1); }
        .a5{ animation-delay: calc(30s / 8 * (8 - 5) * -1); }
        .a6{ animation-delay: calc(30s / 8 * (8 - 6) * -1); }
        .a7{ animation-delay: calc(30s / 8 * (8 - 7) * -1); }
        .a8{ animation-delay: calc(30s / 8 * (8 - 8) * -1); }
        @keyframes scroll{
           to{
            left:-250px;
           }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="box a1"><img src="govind2.jpg"></div>
        <div class="box a2">1</div>
        <div class="box a3">1</div>
        <div class="box a4">1</div>
        <div class="box a5">1</div>
        <div class="box a6">1</div>
        <div class="box a7">1</div>
        <div class="box a8">1</div>
    </div>
</body>
</html>
