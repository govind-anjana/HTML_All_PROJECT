<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            background-image: url("https://images.pexels.com/photos/531880/pexels-photo-531880.jpeg?cs=srgb&dl=pexels-pixabay-531880.jpg&fm=jpg");
            background-size: cover;
        }
        
        h1{
            background: transparent;
            backdrop-filter: blur(3px);
             box-shadow: 0px 0px red;;
            font-size: 160px;
            border-radius: 15px;
            color:white;
            display: inline-block;
            margin:15% 6%;
            text-shadow:4px 4px 4px  black ,-4px -4px 5px black ;
            animation: go 6s infinite;
            transition: 6s;  
            font-family:sans-serif;  
             
        }
        @keyframes go{
            0%{border-top: 8px dashed blue;}
            30%{border-right: 8px dotted white;}
            60%{border-bottom: 8px dashed blue;}
            90%{border-left: 8px dotted white;}
        }
        span:nth-child(even){
            color:blue;
            animation: fir 5s infinite;
        }
        span:nth-child(odd){
             
            animation: se 5s infinite;
        }

        @keyframes fir{
            0%{color:white;}
            50%{color:pink;}
            0%{color:brown;}
        }
        @keyframes se{
            0%{color:blue;}
            50%{color:brown;}
            90%{color:pink;}
        }
        span:hover{
           color:chartreuse;
            cursor: pointer;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="main">
       <h1><span>R</span><span>O</span><span>H</span><span>I</span><span>T</span>&nbsp;&nbsp;<span>A</span><span>N</span><span>J</span><span>A</span><span>N</span><span>A</span></h1>
    </div
</body>

</html>
