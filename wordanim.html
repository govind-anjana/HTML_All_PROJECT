<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background: rgb(70, 150, 100);
    }
    .box{
        background-color: black;
        color:white;
        padding:3px 40px;
        position: absolute;
        top:40%;
        left:40%;
        text-transform: capitalize;
        height:60px;
        border-radius: 20px;
        overflow: hidden;
    }
    .names{
        font-size: 30px;
        line-height: 60px;
    }
    .names:first-child{
        animation: govind 10s linear 5 ;
    } 
    @keyframes govind{
        0%{margin-top: 0px;}
        10%{margin-top: -60px; }
        20%{margin-top: -120px;}
        30%{margin-top: -180px;}
        40%{margin-top: -240px; }
        50%{margin-top: -300px;}
        60%{margin-top: -360px;}
        70%{margin-top: -420px;}
        80%{margin-top: -480px;}
        90%{margin-top: -540px;}
        100%{margin-top: -600px;}
    }
</style>
<body>
    <div class="box">
    <div class="names">Daughter of Mountain</div>
    <div class="names">Mother of Devotion and Penance</div>
    <div class="names">Destroyer of Demons</div>
    <div class="names">Goddess of Cosmic Egg</div>
    <div class="names">Goddess of Motherhood and Children</div>
    <div class="names">Goddess of Power</div>
    <div class="names">Kalaratri </div>
    <div class="names">Mahagauri Mata</div>
    <div class="names">Siddhidatri Mata</div>
    </div>
</body>
</html>
