<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0;padding: 0;box-sizing: border-box;}
        .main{
         background-color:black;
         /* border: 2px sold black; */
         min-height:97vh;
         margin: auto;
         display: flex;
         justify-content: center;
         align-items: center;
        
        }
        .main .box{
           width:300px;
           height:300px;
            animation: govind 10s  linear infinite;
        }
        .main .box span{
            position: absolute;
            top:0;
            left:0;
            width:100%;
            height: 100%;
            transform: rotate(calc(20deg * var(--i)));        
        }
        .main .box span::before{
            content:'';
            position: absolute;
            top:0;
            left:0;
            width:30px;
            height:30px;
            border-radius: 50%;
            background-color:#00ff0a;
        box-shadow: 0px 0px 10px #00ff0a, 0px 0px 20px #00ff0a,0px 0px 40px #00ff0a;
        animation: animate 2s linear infinite;
           animation-delay: calc(0.1s * var(--i));

        }
        @keyframes animate{
            0%,20%{transform: scale(1);}
            80%,100%{transform: scale(0);}
        }
        @keyframes govind{
        0%{
          filter:hue-rotate(0deg)
            /* transform: rotate(0deg); */
        }
    100%{
            /* transform: rotate(360deg); */
          filter:hue-rotate(360deg)

        }
        }
    </style>
</head>
<body>
        <div class="main">
        <div class="box">
            <span style="--i:1;"></span>
            <span style="--i:2;"></span>
            <span style="--i:3;"></span>
            <span style="--i:4;"></span>
            <span style="--i:5;"></span>
            <span style="--i:6;"></span>
            <span style="--i:7;"></span>
            <span style="--i:8;"></span>
            <span style="--i:9;"></span>
            <span style="--i:10;"></span>
            <span style="--i:11;"></span>
            <span style="--i:12;"></span>
            <span style="--i:13;"></span>
            <span style="--i:14;"></span>
            <span style="--i:15;"></span>
            <span style="--i:16;"></span>
            <span style="--i:17;"></span>
            <span style="--i:18;"></span>
            <span style="--i:19;"></span>
            <span style="--i:20;"></span>
        </div>
        </div>
    </div>
</body>
</html>
