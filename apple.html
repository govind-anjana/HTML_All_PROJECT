<style>
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }
    body{
        background-color: white;
    }
    .container{
        width:60vw;
        margin:auto;
        border:3px solid black; 
        background-image: url('https://t3.ftcdn.net/jpg/07/53/20/82/240_F_753208233_2tFjybdyLCTU12MEJfguSJKBtl0sG5pj.jpg');
        /* background-size: cover; */
    }
    h1{
            background: linear-gradient(red 10%,orange );
            /* display: inline; */
            font-size: 50px;
            text-transform: uppercase;
            text-align: center;
            -webkit-background-clip:text;
            -webkit-text-fill-color: transparent;
            font-family: sans-serif;
           filter: drop-shadow(2px 2px 1px white );
           position: sticky;
           top:1px;
           z-index: 1;
    }
    #main{
        height:90vh;
        overflow: scroll;
        /* border:2px solid red; */
        display: grid;
        grid-template-columns: repeat(4,1fr);
        grid-auto-rows: minmax(170px,auto);
        gap:15px;
        padding:15px;   
    }
    #main::-webkit-scrollbar{
        display: none;
    }
    .box{
        border:2px solid black;
        overflow: hidden;
        border-radius: 30px;
        position: relative;
        padding:9px;
        background-color: white;
    }
    .box:hover{
        box-shadow: 0px 0px 10px 5px silver;
    }
     .box .sort{
        position: absolute;
        font-size: 40px;
        top:1px;
        color:red;
        font-weight: 800;
        font-family: sans-serif;
    }
    .a1 .sort,.a5 .sort,.a9 .sort,.a15 .sort,.a21 .sort{
        color:rgb(11, 146, 229);
    }
    .box .full{
        position: absolute;
        bottom: 7px;
        left:15px;
        color:black;
        font-family: sans-serif;
        font-size: 20px;;
        font-weight: 700;
        
    }
    .box img{
        /* position: relative; */
        width:90%;
        height:158px;
        /* border:2px solid red; */
        float: right;
    }
    @media screen and (max-width:1124px){
        body{
        background-color: black;
    }
        .container{
            width:70vw;
        }
        #main{
            height:550px;
            grid-template-columns: repeat(3,1fr);
        }
    }
    @media screen and (max-width:768px){
        body{
        background-color: silver;
    }
        #main{
            grid-template-columns: repeat(2,1fr);
        }
    }
    @media screen and (max-width:600px){
        body{
        background-color: gray;
    }
        h1{
            font-size: 35px;
        }
        #main{
            height:98vh;
            grid-template-columns:1fr;
        }
    }
</style>
