<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .main{
        width:40%;
        border:2px solid red;
        height:96vh;
        margin:auto;
        box-shadow: 0px 0px 10px 5px red;
        display: grid;
        grid-template-columns: 1fr 1fr;
        /* grid-auto-rows: 300px; */
        gap:15px;
        padding:10px;
        overflow: hidden;
        background-color: white;
        z-index: 10;

    }
    .box{
        width:100%;
        height:100%;
        /* border:2px solid black; */
    }
    .box img{
        width: 100%;height:270px;
        background-size: cover;
    }
    .box:nth-child(1),.box:nth-child(5){
        transform: translateX(0px);
        animation: govind 3s linear 1;
    }
    .box:nth-child(4){
        animation: govind4 3s linear 1 ;
    }
    .box:nth-child(3){
        animation: govind3 7s linear 1 ;
    }
    .box:nth-child(2),.box:nth-child(6){
        animation: govind2 7s linear 1 ;
    }
    audio{
        position: absolute;
        /* top:50%;
        left:50%; */
         z-index: 1; 
    }
    @keyframes govind{
        from{
            transform: translateX(-100%);
        }
    }
    @keyframes govind4{
        from{
            transform: translateX(100%);
        }}
    @keyframes govind2{
        from{
            transform: translateX(200%);
        }
        
    }
    @keyframes govind3{
        from{
            transform: translateX(-200%);
        }
        
    }
</style>
<body>
    <audio controls autoplay src="ga.mp3" >
    </audio>
    <div class="main">
        <div class="box a1"><img src="https://www.livehindustan.com/lh-img/uploadimage/library/2022/08/31/16_9/16_9_6/ganesh_chaturthi_2022_1661930654.jpg"></div>
        <div class="box a2"><img src="https://www.shyamparivar.com/uploads/gallery/Beautiful-Ganpati-Ji-HD-Photo-Free-Download.jpg"></div>
        <div class="box a3"><img src="https://www.shyamparivar.com/uploads/gallery/design-ganesh-photo.jpg"></div>
        <div class="box a4"><img src="https://cdn.pixabay.com/photo/2024/03/27/07/14/ai-generated-8658378_1280.jpg"></div>
        <div class="box a5"><img src="https://i.etsystatic.com/25971773/r/il/4ec567/4213156275/il_340x270.4213156275_9vm7.jpg"></div>
        <div class="box a5"><img src="https://www.shyamparivar.com/uploads/gallery/lord-gansha-wallpaper.jpg"></div>
    </div>
</body>
</html>
