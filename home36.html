<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            padding:0px;
            margin:0px;
            box-sizing: border-box;
        }
        main{
            width:60%;
            height:500px;
            box-shadow: 0px 0px 4px red;
            margin:auto;
            margin-top:25px;
            position:relative;
            overflow: hidden;
        }
        .slide{
            width:100%;
            height:100%;
            position: absolute;
            transition:3s;
        }
        .nav{
            text-align:center;
            margin-top:20px;
        }
        button{
            font-size:25px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <img src="dog.jpg" class="slide">
        <img src="https://picsum.photos/id/237/848/500" alt="" class="slide">
        <img src="https://picsum.photos/id/236/848/500" alt="" class="slide">
        <img src="https://picsum.photos/id/238/848/500" alt="" class="slide">
        <img src="https://picsum.photos/id/239/848/500" alt="" class="slide">
     </main>
     <div class="nav">
        <button onclick="prew()">Prew</button>
        <button onclick="next()">Next</button>
    </div>
</body>
<script>
    var slides=document.querySelectorAll(".slide");
    counter=0;
    slides.forEach((slide,index)=>{
    slide.style.left=`${index*100}%`;
    })
     
        function prew(){
        counter--;
        getImages();
     }
     function next(){
        counter++;
        getImages();
        if(counter==slides.length-1){
            counter-=slides.length;
        }
    }
    getImages=()=>{
        slides.forEach((slide)=>{
            slide.style.transform=`translate(-${counter*100}%)`
        })
    }
</script>
</html>
