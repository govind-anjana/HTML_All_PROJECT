<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *
{
    padding:0px;
    margin:0px;
    box-sizing: border-box;
}
main
{
    width:100%;
    height:96vh;
    background-color:pink;
    display: flex;
    justify-content: center;
    align-items: center;
}
.a{
    width:32%;
    height:30%;
    background-color: silver;
    font-size:24px;
    border:none;
    outline:none;
}
#item
{
    width:100%;
    height:30px;
    background-color: aqua;
    font-size: 20px;
    padding-left:20px;
}
#todobox{
   
    list-style: none;
}
#todobox li{
    font-size: 25px;   
    margin-top: 5px;
    background-color: blueviolet; 
    cursor: pointer; 
    
}
#todobox li i{
float:right;
cursor: pointer;
}
.dono
{
    text-decoration: line-through;
    background-color: black !important ;
    color:white;
}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />  
</head>
<body>
    <main>
        <div class="a">
            <input type="text" id="item" placeholder="Enter Your Serivese">
            <ul id="todobox">
                           
            </ul>
        </div>
    </main>
</body>
<script>
    const iteam=document.querySelector("#item");
    const todo=document.querySelector("#todobox");
    iteam.addEventListener("keyup",
    function (event){
        if(event.key=="Enter"){
            addd(this.value);
            this.value="";
        }
    }
    )
    addd=(it)=>{
        itemlist=document.createElement("li")
        itemlist.innerHTML=`${it} 
                    <i class="dele fas fa-cat"></i>`;                 
                    itemlist.addEventListener("click",
                    function(){
                        this.classList.toggle("dono")
                    }               
                    )
                    itemlist.querySelector("i").addEventListener("click",
                    function(){
                        itemlist.remove();
                    })
                    todobox.appendChild(itemlist);
    }
</script>
</html>
