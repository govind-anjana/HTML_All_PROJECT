
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{padding: 0;margin: 0;box-sizing: border-box;}

body{
     height: 100vh;
     display: flex;
     justify-content: center;
     align-items: center;
     background: linear-gradient(red,yellow);
}

.sliders{   
      width: 45%;
      height: 450px;
      /* position: relative; */
      overflow: hidden;
      background-size: cover;
      box-shadow:0px 0px 7px 5px red;  
}
.images{
      width:100%;
      display: flex;
    }
    .images img{
        width: 100%;  
        height:400px;
        
    /* border:2px solid red; */
    border-radius:20px;
}
input{display: none;}
.dots{
       display: flex;
       justify-content: center;
       text-align: center;     
}
 label{
        width: 30px;
        height: 30px;
        border: 2px solid black;
        background-color: blueviolet;
        color:white;
        margin: 10px;
        border-radius: 20px;
}
#img1:checked ~ .label-1,#img2:checked ~ .label-2,#img3:checked ~ .label-3{
    background-color:black;
    color:white;
  }
#img1:checked ~ .m1{margin-left: 0%; color:red}
#img2:checked ~ .m2{margin-left: -100%;}
#img3:checked ~ .m3{margin-left: -200%;}
#img4:checked ~ .m4{margin-left: -300%;}
#img5:checked ~ .m5{margin-left: -400%;}
</style>
<body>
    <div class="sliders">
        <div class="images">
            <input type="radio" name="slide" id="img1">
            <input type="radio" name="slide" id="img2">
            <input type="radio" name="slide" id="img3">
            <input type="radio" name="slide" id="img4">
            <input type="radio" name="slide" id="img5">
            <img src="https://wallpapercave.com/wp/wp12987915.jpg" alt="" class="m1">
            <img src="https://wallpapercave.com/wp/wp12987960.jpg" alt="" class="m2">
            <img src="https://wallpapercave.com/wp/wp12988009.jpg" alt="" class="m3">
            <img src="https://wallpapercave.com/wp/wp14342366.jpg" alt="" class="m4">
            <img src="https://wallpapercave.com/wp/wp12988009.jpg" alt="" class="m5">
        </div>
            <div class="dots">
            <label for="img1" class="label-1">1</label>
           <label for="img2" class="label-2">2</label>
           <label for="img3" class="label-3">3</label>
           <label for="img4" class="label-4">4</label>
           <label for="img5" class="label-5">5</label>
           </div>
    </div>
</body>
</html>
