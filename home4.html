<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *
{
    padding:0px;
    margin:0px;
    box-sizing: border-box;
}
.a
{
    width:100%;
    height:96vh;
    background-color: azure;
    display: flex;
    justify-content: center;
    align-items: center;
}
.b{
    width:25%;
    background-color: silver;
    font-size:24px;
}
input[type="checkbox"]{
    width:20px;
    height:20px;
    margin-right:10px;
    accent-color:black;
}
#ans
{
    width:100%;
    height:30px;
    background-color: aqua;
    font-size: 20px;
    padding-left:20px;
}


button{
    width:100%;
    font-size: 25px;
    color:red;
    background-color: blueviolet;
}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="a">
    <div class="b">
         <p id="ans">TEXTING</p>
        <div>
            <span style="float:left">Password Length</span>
            <span style="float:right"><input type="number" id="cha" min="1" max="20" value="3" ></span>
        </div>
        <div style="line-height: 30px;">         
            <span style="float:left">Contains UpperCase</span>
            <span style="float:right"><input type="checkbox" checked id="upp"></span>
        </div>
        <div>
            <span style="float:left">Contains Lowercase</span>
            <span style="float:right"><input type="checkbox" id="low"></span>
        </div><br>
        <div style="line-height: 30px;">         
            <span style="float:left">Contains Number</span>
            <span style="float:right"><input type="checkbox" id="num"></span>
        </div>
        <div style="line-height: 30px;">         
            <span style="float:left">Contains Symbols</span>
            <span style="float:right"><input type="checkbox" id="sym"></span>
        </div>
        <button id="su">Submit</button>
    </div>
    </div>
</body>
<script>
    const upperSet="QWERTYUIOPASDFGHJKLZXCVNM";
    const lowerSet="qwertyuiopasdfghjklzxcvnm";
    const numset="1234567890";
    const symset="!@#$%^&*(),<?/+_";


   ansInputs= document.getElementById("ans");
   lenInputs= document.getElementById("cha");
   uppInputs= document.getElementById("upp");
   lowInputs= document.getElementById("low");
   numInputs= document.getElementById("num");
   symInputs= document.getElementById("sym");

    getre =(data)=>{
 return data[Math.floor(Math.random() * data.length)]
    }

    genredpassword =(password="")=>
    {
    if(uppInputs.checked){
        password += getre(upperSet)
    }
    if(lowInputs.checked){
        password += getre(lowerSet)
    }
    if(numInputs.checked){
        password += getre(numset)
    }
    if(symInputs.checked){
        password += getre(symset)
    }
    if(password.length <= lenInputs.value)
    {
        return  genredpassword(password)
    }
     ansInputs.innerHTML=trun(password,lenInputs.value);
    }

 document.getElementById("su").addEventListener("click",function(){
    genredpassword();
 })

   function trun(str,num){
    if(str.length>num){
        subStr=str.substring(0,num);
        return subStr;       
    }
    else{
        return str;
    }
   }
</script>
</html>
