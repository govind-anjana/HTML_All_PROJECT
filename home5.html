<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            padding:0px;
            margin:0px;
            box-sizing: border-box;
        }
        #main
        {
            width:100%;
            height:100vh;
            background-color: aqua;
            padding:4%;
        }
        .a
        {
            width:30%;
            height:70%;
            background-color: rgb(227, 223, 223);
            margin:1%;
            float:left;
            margin-bottom: 20px;
            
        }
        .b{
            width:100%;
            height:32px;
            background-color: blue;
             color:white;
           
        }
        .button{
            float:right;
           margin:3px;
           cursor: pointer;
           font-size:20px;
        }
        #su{
            position: fixed;
            top:20px;
            right:50px;
            font-size: large;
            padding:4px;
            background-color: red;
            color:white;
            border:none;
            border-radius: 20px;
            cursor: pointer;
        }
        textarea{
            width:100%;
            height:230px;
            border: none;
            text-indent: 20px;
            font-size: 20px;
            padding:3px;
        }
        textarea:focus{
            outline: none;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />   
</head>
<body>
     <div id="main">
        <button id="su">Add Notes</button>
  
     </div>
</body>
<script>
    const addtn=document.querySelector("#su");
    const main= document.getElementById("main");
  save=()=>{
    notes=document.querySelectorAll(".note textarea");
    console.log(notes);
    data=[];
    notes.forEach( (note)=>{
        data.push(note.value);
    })
    if(data.length===0){
        localStorage.removeItem("notes")
    }
    else {
    localStorage.setItem("notes",JSON.stringify(data))
    }
  }
    
adNote =(text="")=>{
    note=document.createElement("div");
    note.classList.add("note");
    note.innerHTML=`<div class="a">
    <div class="b">
        <button class="button"> <i class="treas fas fa-cat"></i></button>
        <button class="button"><i class="dele fas fa-cat"></i></button>
    </div>
    <textarea>${text}</textarea>
   </div>`;
   note.querySelector(".treas").addEventListener("click",function(){
    note.remove()
    save()
})
note.querySelector(".dele").addEventListener("click",function(){
    save()
})
   main.appendChild(note);
   save()
}
 
</script>
</html>
