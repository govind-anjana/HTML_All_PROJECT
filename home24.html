                 <button>Click me</button>
           
        </form>

</body>
<script>
   var password= document.getElementById("paas");
   flag=1;//1 no error and 0 error
  function dem(elem){
    if(elem.value.length > 0)
    {
        console.log(elem.value);
        if(elem.value != password.value){
            document.getElementById("ans").innerHTML="Conform Password is Not Match"; 
        flag=0;
        }
        else{
            document.getElementById("ans").innerHTML="";
            flag=1;
        }
    }
    else{
        document.getElementById("ans").innerHTML="Place Conform Password";
        flag=0;
    }
  }
  function lelided(){
    if(flag==1){
        return true;
    }
    else{
        return false;
    }
  }
