<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            padding:0px;
            margin:0px;
            color:white;
        }
        main{
            width:100%;
            height:98vh;
            background:linear-gradient(to top right ,silver,blueviolet);
        }
        .mean{
            width:40%;
            height:40%;
           
            padding:20px;
            position: relative;
            top:200px;
            float:left;
        }
        h2{font-size:45px; margin-bottom: 10px;}
        button{
            width:29%;
            height:auto;
            padding:8px;
            background-color: transparent;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid white;
            transition: 2s;
            cursor: pointer;
        }
        button:hover{
            width:40%;
            background-color: white;
            color:black;
            box-shadow: 0 10px 20px white;
            border-radius: 10px;
        }
        .img{
            width:30%;
            height:43%;
            background-color:white;   
            float: left;
            margin-top:210px;
            margin-left:50px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 2s;
            cursor: pointer;
        }
        img{
            width:97%;
            height:94%;
            border-radius: 20px;
           
        }
        .img:hover{
            transform: scale(1.1);
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <div class="mean">
            <h2>OFFICIAL CODER</h2>
            <p style="text-align: justify; line-height: 17px; font-size: 17px;">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Deserunt non voluptatum, dicta perspiciatis eos doloribus consequatur dignissimos exercitationem adipisci impedit magnam suscipit odit eaque laborum sit facilis totam quo provident!</p><br>
            <br>
            <button>Listen Now</button>
        </div>
        <div class="img">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ7VHaFjiPIs8EpbOHMy_u5JS96Teo1IG0rJA&usqp=CAU" alt="wi-fi connecat">
        </div>
    </main>
</body>
</html>
