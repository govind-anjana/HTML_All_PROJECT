                ";

document.querySelector('#ans').value=x;
        ";

                ";>0</button>

        onclick="x=x+'+';
        document.querySelector('#ans').value=x;
                ";
        >+</button>

</body>
<script>
   let x="";
    function fi()
    {
    x=x+'1';
    document.querySelector("#ans").value=x;
    }
</script>
