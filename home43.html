<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .card{
            width:25%;
            height:80%;
            position: absolute;
            margin: auto;
            background-color: orange;
            color:white;
        }
        .card-front {
            position: absolute;
            background-color: orange;
        }
        h1{
            color:white; 
            z-index: 1;    
        }
        
        .card-inner{
            position:absolute;
            width:100%;
            height:100%;
            transition: 4s;
            transform-style:preserve-3d;
        }
        .card:hover .card-inner{
            transform: rotateY(-180deg);
        }
        .card-front .card-back{
            position: absolute;
            width:100%;
            height:100%;
            backface-visibility: hidden;
            background-color: blue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
        }
        .card-back{
            background-color: yellow;
            transform: rotate(-180deg);
        }
        .card-inner img{
            width:100%;
            height:100%;
            transform: rotate(-180deg);

        }
        .head{
            position: absolute;
            top:10px;
            font-size: 40px;
            font-family: sans-serif;
            font-weight: 700;
            color:rgb(255, 0, 0);
            text-align: center;
        }     
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

</html>
