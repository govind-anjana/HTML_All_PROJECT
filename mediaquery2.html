<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 0;margin: 0;box-sizing: border-box;
    }
    .container{
        width:99vw;
        background: linear-gradient(#3AA0D4 10%, #0B6A9D 90%);
    background-image: url(https://templatemo.com/images/templatemo-header-9e.png);
    min-height: 210px;
    /* height:auto; */
    border-bottom: 5px solid #fff;
    box-shadow: 0px 3px 4px -2px #888;
    padding:35px;
    }
    .aside{
        margin-top:20px;
        backdrop-filter: blur(10px);
    }
    .main h1{
        font-size: 60px;
        color:white;

    }
    header{
        padding:10px;    
    }

    .a1{
        float:left;
        color:white;
        font-size: 25px;;   
    }
    .a2{
        float:right;
    }
    .a2
    button{
        padding:10px 25px;
        background-color: #888;
        color:white;
        font-size: 26px;
        margin-left:10px ;
    }
    @media screen and (max-width:900px){
        .container{
            overflow: hidden;
        /* height:400px; */
        }
        .a1{
        float:left;
        color:white;
        font-size: 20px;;
    }
    .a2
    button{
        padding:10px 10px;
        background-color: #888;
        color:white;
        font-size: 17px;
        margin:2px;
    }
    }
</style>
<body>
    <div class="container">
        <header>
            <div class="main"><h1>Template<span style="color:red">mo</span></h1></div>
            <div class="aside">
                <div class="box a1">Free HTML CSS Website Templates</div>
                <div class="box a2">
                    <button>Free Templates</button>
                    <button>HTML Templates</button>
                    <button>Links</button>
                    <button>Contact</button>
                </div>
            </div><br/><br/>
        </header>
    </div>
</body>
</html>
