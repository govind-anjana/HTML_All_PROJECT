<html>
<head>
<style>
body{
background:linear-gradient(to top left,pink,silver,green);
}
table
{
width:50%;
background-color:silver;
margin:auto;
margin-top:15%;
}
#pin
{
width:90%;
padding:5px;
}
input 
{
width:100%;
padding:3px;
font-size:20px;
}
</style>
<script>
function demo()
{
var x=document.getElementById("pin").value;
r=document.getElementById("region");
r1=document.getElementById("state");
r2=document.getElementById("dis");
 y=x.substring(0,1);
 z=x.substring(0,2);
 w=x.substring(2,4);
 if(y==1 || y==2)
 {
 r.value="Northern";
 if(z==11)
 r1.value="Delhi";
 if(z==12 || z==13)
 r1.value="Haryana";
 if(z==14 || z==15 || z==16)
 r1.value="Panjab";
 if(z==17)
 r1.value="Himachal Pradesh";
 if(z==18 || z==19)
 r1.value="Jammu & Kashmir";
 if(z>=20  && z<=28)
 r1.value="Uttar Pradesh";
 }
 else
 if(y==3 || y==4)
 {
 r.value="Western";
 if(z>=30 && z<=34)
 r1.value="Rajesthan";
  if(z>=36 && z<=39)
 r1.value="Gujarat";
  if(z>=40 && z<=44)
 r1.value="Maharashtra";
  if(z>=45 && z<=49)
 r1.value="Madhya Pradesh $ chattisgarh";
 if(w==33 || w==34)
 r2.value="AshokNagar";
 if(w==40 || w==41 || w==42 || w==43 || w==48)
 r2.value="Anuppur";
 if(w>=10 && w<=18)
 r2.value="Barwani";
 }
 else
 if(y==5 || y==6)
 {
 r.value="Southern";
  if(z>=50 && z<=53)
 r1.value="Andhra Pradesh & Telangana";
  if(z>=56 && z<=59)
 r1.value="Karnataka";
  if(z>=60 && z<=64)
 r1.value="Tamil Nadu";
 if(z>=67 && z<=69)
 r1.value="Kerala";
 }
 else
 if(y==7 || y==8)
 {
 r.value="Eastern";
 if(z>=70 && z<=74)
 r1.value="West Bengal";
 if(z>=75 && z<=77)
 r1.value="Orisa";
 if(z==78)
 r1.value="Assam";
 if(z==79)
 r1.value="Arunachal Pradesh"; 
 if(z>=80 && z<=85)
 r1.value="Bihar";
 }
 else
 {
 r.value="ArmyPostal";
  r1.value="Jharkhand";
 }
 
}
</script>
</head>
<body>
<form>
<table  cellpadding="15px" cellspacing="0px">
<tr>
<th colspan="3">
<input type="number" id="pin" onblur="demo();" placeholder="Enter Pin Code"></th>
</tr>
<tr>
<td><input type="text" id="region" readonly placeholder="Select Region"></td>
<td><input type="text" id="state" readonly placeholder="Select State"></td>
<td><input type="text" id="dis" readonly placeholder="Select District"></td>
</tR>
</table>
</form>
</body>
</html>
