        <div class="containtor">

<script>
    function demo(){ 
        const date=document.getElementById("date").value;
        const month=document.getElementById("month").value;
        const year=document.getElementById("year").value;
         
        if(date>31 || month>12 || year.length>=5){
            alert("The Value Of Wrong");
        }
        else{
       const to=month+"/"+date+"/"+year;
            const old=new Date(to);
            olddate=old.getDate();
            oldmo=old.getMonth()+1;     
            const d=new Date();
            da=d.getDate();
            mo=d.getMonth()+1;
            ye=d.getFullYear();            
            if(mo>=oldmo){
                document.getElementById("ans").innerHTML=(ye-year);
                if(mo==oldmo && da<=olddate){
                document.getElementById("ans").innerHTML=(ye-year)-1;  
                }
                else{
                    document.getElementById("ans").innerHTML=(ye-year);
                }   
            }
            else{  
                document.getElementById("ans").innerHTML=(ye-year)-1;
            }        
        }
    }
        function squr(){
           const squr= document.getElementById("squr").value;
           sqer= document.querySelectorAll(".sqrt1");
           sqer[0].innerHTML=squr*squr;
           sqer[1].innerHTML=squr*squr*squr;
           // sqer[2].innerHTML=Math.sqrt(squr).toFixed(1);
            sqer[2].innerHTML=Math.sqrt(squr).toLocaleString(1);
        }
</script>
