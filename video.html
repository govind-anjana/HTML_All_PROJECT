<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        border:2px dashed red;
        display: grid;
        place-items: center;
        height:97vh;
        position:relative;
        overflow: hidden;
        /* background: url('https://i.pinimg.com/originals/3b/e8/ba/3be8ba724e3bc3c01ab91b478eae2749.gif'); */
        background-size: cover;
         
    }
   .box ul {
        display: flex;
        gap:40px;
        border-bottom: 10px solid red;
        position:  relative;
        top:10px;
        /* z-index: 1; */
       /* background: linear-gradient(cyan,purple,orange);
        -webkit-background-clip: text;
        -webkit-text-fill-color:transparent; */

    }
   .box ul li{
        font-size: 50px;;
        text-transform: uppercase;
        font-family: sans-serif;
        /* list-style:none; */
        display: flex;
        justify-content: center;
        font-weight: 700;
        padding:5px 15px;
        border-radius: 50%;;
        animation: govind 3s linear 4 ;
        box-shadow: 0px 0px 10px 10px pink;
        color:white;

    }
    @keyframes govind{
        0%,100%{transform: translateY(0px);}
        50%{transform: translateY(-300px);}
       
    }
    ul li:nth-child(1){
        background-color: pink;
        animation-delay: 0s;
    }
    ul li:nth-child(2){
        animation-delay: 0.2s;
        background-color: blue;
    }
    ul li:nth-child(3){
        animation-delay: 0.4s;
        background-color: rgb(150, 150, 158);
    }
    ul li:nth-child(4){
        animation-delay: 0.6s;
        background-color: rgb(15, 186, 239);
    }
    ul li:nth-child(5){
        animation-delay: 0.8s;
        background-color: rgb(251, 255, 0);
    }
    ul li:nth-child(6){
        animation-delay: 1s;
        background-color: rgb(255, 0, 225);
    }
    ul li:nth-child(7){
        animation-delay: 1.2s;
        background-color: rgb(255, 0, 162);
    }
    ul li:nth-child(8){
        animation-delay: 1.4s;
        background-color: rgb(0, 255, 174);
    }
    ul li:nth-child(9){
        animation-delay: 1.6s;
        background-color: rgb(50, 53, 52);
    }
    ul li:nth-child(10){
        animation-delay: 1.8s;
        background-color: rgb(0, 213, 255);
    }
    ul li:nth-child(11){
        animation-delay: 2s;
        background-color: rgb(128, 162, 151);
    }
    ul li:nth-child(12){
        animation-delay: 2.2s;
        background-color: rgb(0, 221, 255);
    }
    video{
        position: absolute;
    }

    </style>
<body>
    <div class="box">
    <video muted autoplay width="100%">
<source src="https://cdn.pixabay.com/video/2021/03/08/67358-521707474_tiny.mp4"></video>
        <ul>
            <li>g</li>
            <li>o</li>
            <li>v</li>
            <li>i</li>
            <li>n</li>
            <li>d</li>
            <li>a</li>
            <li>n</li>
            <li>j</li>
            <li>a</li>
            <li>n</li>
            <li>a</li>  
        </ul>
    </div>
    <!-- </video> -->
</body>
</html>
