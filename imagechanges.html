<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        #main{
            width:100%;
            height:96vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        #image{
            margin-top:10%;
            width:50%;
            height:65%;
            box-shadow: 0px 0px 20px white;
            background-color: white;
            border-radius: 8px;
        }
        h2{
            color:red;
            font-size: 50px;
            position:fixed;
            top:8%;
            padding:7px 21px;
        }
        #uu{
            margin-top:10%;
            position: absolute;
            font-size: 20px;
            color:white;
            font-weight: 600;
        }
        button{
            padding:6px;    
            cursor: pointer;
        }
    </style>
    <title>Document</title>
</head>
<body>
        <div id="main">
             <h2 id="h2">00</h2>
             <span id="uu">Govind</span>
            <div id="image"></div>
           
        </div>
</body>
<script>
    const go=document.getElementById("image");
     to=0;
    function demo(){
        to=to+1; 
        str="1234567890ABCDEF";
        color="#";
        for(i=0;i<6;i++)
        { 
            color += str[Math.floor(Math.random()*16)];
            //  console.log(color);  
        }
        console.log(color);
             go.style.backgroundColor=color; 
            //  console.log(to);
             document.querySelector("#uu").innerHTML=to;
             if(to==10){
            govind();
             }
    }
    function govind(){
        // console.log("govind");
        clearInterval(breaks);
        clearInterval(anjana);
    }
  const breaks=setInterval(()=>{
        demo();
    },11000);
    
    j=0;
    function demos(){
        j=j+1; 
        //  console.log(j);
         if(j<=10){
            document.getElementById("h2").innerHTML=10-j;
        }  
         else{
            j=0;
         }
    }
   const anjana=setInterval(()=>{
        demos()
    },1000);

</script>
</html>
