<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            box-sizing: border-box;
           /* background-image:url(image3.jpg);
           background-size: cover; */
           background-color: black;
            color:white;
        }
        .containtor{
            width:30%;
            margin:8% auto;
            padding:20px;
            border:4px solid white;
            box-shadow: 0px 0px 10px 5px pink;
            border-radius: 20px;;
        }
        #ans{
            width:26%;
            margin:10% auto;
            padding:10px 15px;
            border:3px solid white;
            box-shadow: 0px 0px 20px 4px orangered;
            font-size: 30px;
            border-radius: 10px;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            display:block;
        }
        label{
            font-size:30px;
             display: flex;
             justify-content: center;
             font-family: sans-serif;
        }
        input[type="number"]
        {
            padding:5px 10px;
            width:85%;
            font-size: 25px;
            border:2px solid orange;
            box-shadow: 0px 0px 10px 3px white;
            border-radius: 10px;;
            outline: none;
            margin-left:33px;
        }
    </style>
    <title>Document</title>
</head>
<body>
        <div class="containtor">
            <label for="num">Enter Any Number : </label><br><br>
            <input type="number" id="num" onkeyup="demo()" placeholder="Place Enter Number">
        </div>
        <div id="ans">Enter Any Number</div>
</body>
<script>
    function demo(){
        const num=document.getElementById("num").value;
        const ans=document.getElementById("ans");
        // console.log(typeof(num));
        
        if(num>=0 && num<=255){
            char=String.fromCharCode(num);
            ans.innerHTML=char;
        }
        else{
              ans.innerHTML="Number is Biggest";
              alert("Wrong number");
        }
   }
</script>
</html>
