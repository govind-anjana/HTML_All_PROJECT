<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .containor{
        display: grid;
        grid-template-columns: repeat(auto-fill,minmax(320px,4fr));
        grid-auto-rows: minmax(100px,auto);
        grid-auto-columns: minmax(200px,auto);
        grid-gap: 20px;

    }
    .item{
            background-color:blue;
            color:red;
            border-radius: 10px;
            border:2px solid black;
        }
        #item1{
            grid-column-start: 1;
            grid-column-end: 5; 
            background-color: darkviolet;
        }
        #item2{
            grid-row-start:2 ;
            grid-row-end:6 ;
            grid-column-start: 1;
            grid-column-end: 2; 
            background-color: cyan;
        }
        #item3{
            grid-row-start:2 ;
            grid-row-end:4 ;
            grid-column-start: 2;
            grid-column-end: 4; 
            background:linear-gradient(to right  bottom, blue 60%,cyan);
        }
        #item4{
            grid-row-start:4;
            grid-row-end:6 ;
            grid-column-start: 2;
            grid-column-end: 3; 
            background:linear-gradient(to right bottom, blue 60%,cyan);
        }
        #item5{
            grid-row-start:4;
            grid-row-end:6 ;
            grid-column-start: 3;
            grid-column-end: 4; 
            background:linear-gradient(to right bottom, blue 60%,cyan);
        }
        #item6{
            grid-row-start:2;
            grid-row-end:6 ;
            grid-column-start: 4;
            grid-column-end: 5; 
            background-color:cyan
        }
        #item7{
            grid-row-start:6;
            grid-row-end:7 ;
            grid-column-start: 1;
            grid-column-end: 5; 
            background-color:darkorchid;
        }
       
</style>
<body>
    <div class="containor">
        <div class="item" id="item1">Header</div>
        <div class="item" id="item2">Sidebar</div>
        <div class="item" id="item3">Columns-1</div>
        <div class="item" id="item4">Columns-2</div>
        <div class="item" id="item5">Columns-3</div>
        <div class="item" id="item6">Navber</div>
        <div class="item" id="item7">Footer</div>
    </div>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="ans">
        <button onclick="demo()">Otp Click</button></div>
</body>
<script>
     const demo=()=>{
        const ans=document.getElementById("ans");
        var otp="";
        for(i=1;i<=6;i++){
            otp+=Math.floor(Math.random()*10);
             
        }
       go= document.createElement("div");
       go.innerHTML=otp;
        ans.appendChild(go);
     }
</script>
</html>
