<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            padding:0px;
            margin:0px;
            box-sizing: border-box;
        }
        main{
            height:97vh;
            background-color:black;
            display:flex;
            justify-content: center;
            align-items: center;

        }
        .containtor{
            width:35%;
            height:auto;
            border:0px solid red;
            border-radius: 20px;
            box-shadow: 0px 0px 20px 8px white;
        }
        h2{
            text-align:center;
            margin:5px;
            color:white;
        }
            label,span{
                font-size: 23px;
                font-weight: 700;
                font-style: italic;
                color:orange;
                text-transform: capitalize;
            }

            input[type="text"]{
                width:96%;
                padding:3px 7px;
                font-size: 26px;
                outline: none;
                color:red;
                text-transform: capitalize;
            }
            input[type="button"]{
                padding:6px;
                font-size: 24px;
                background-color: white;
                cursor: pointer;
                border-radius: 10px;
                border: none;
                font-weight: 600;
            }
     </style>
     <title>Document</title>
</head>
<body>
        <main>
            <div class="containtor">
                <h2>Love Percetage</h2>
                <hr color="white">
              
                <table cellspacing="15px">
                    <tr>
                        <td width="60%"><label for="boy">Enter Your Boy's Name:</label></td>
                        <td><input type="text" id="boy"></td>
                    </tr>
                    <tr>
                        <td width="50%"><label for="girl">Enter Your Girl's Name:</label></td>
                        <td><input type="text" id="girl"></td>
                    </tr>
                    <tr>
                        <th colspan="2"><input type="button" id="start" value="Submit"></th>
                    </tr>
                    <tr>
                        <th colspan="2"><span id="ans" style="color:white; font-family: sans-serif;">Enter Yours Names</span></th>
                    </tr>
                </table>
            </div>
        </main> 
</body>
<script>
    document.querySelector("#start").addEventListener(
     "click",()=>{
        const boy=document.getElementById("boy");
      const girl=document.getElementById("girl");
      if(boy.value=="" || girl.value==""){
        alert("Enter The name");
      }
      else{
        const rand=(Math.random()*100).toFixed(2);
    
      document.getElementById("ans").innerHTML=`${boy.value} and ${girl.value} Love Percetage : ${rand} %`;
      boy.value="";
      girl.value="";
      }
      }
    );
</script>
</html>
