<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            font-size: 30px;;
        }
         button{
             background-color: red;
             color:white;
             width:10%;
             padding:5px;
             font-size: 16px;
             margin-left:30%;
             border:none;
             border-radius:10px;
        }
        button:hover{
            transform:scale(0.8);
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="sett(6)">Click</button>
    <div id="ans"></div>
</body>
<script>
    sett = (digit) => {
       
        var otp="";
        for(let i=1;i<=digit;i++){
            otp+=[Math.floor(Math.random()*10)];
        }
        document.getElementById("ans").innerHTML=otp;
        //  window.open("http://127.0.0.1:5500/otp.html");
    }
</script>
</html>
