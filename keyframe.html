<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height:90vh;
            background-color: silver;
        }
        .main{
            height:90vh;
            padding:10px;
            background-color:pink;          
        }
        .box{
            position: relative;
        width:200px;
        height:200px;
            font-size: 20px;
            background-color: red;
            animation: name duration timing-function delay iteration-count direction fill-mode;
            animation: govind 5s ease-in-out 2s 3;
        }
        @keyframes govind{
        
            0%,100%{top:0;left:0;background-color:red;}
            20%{top:200px;left:0;background-color: silver;}
            60%{top:200px;left:200px;background-color: greenyellow;}
            80%{top:0;left:200px;background-color: blue;}
        }
        /* @keyframes govind{
            100%{top:0;left:0;background-color: aqua;}
        } */
        /* @keyframes govind {
            from{
                width:300px;
            }
            to{
                width:600px;
            }
        } */
    </style>
</head>
<body>
    <div class="container">
        <div class="main">
        <div class="box">govind</div>
        </div>
    </div>
</body>
</html>
