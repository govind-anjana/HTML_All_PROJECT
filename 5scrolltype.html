<!DOCTYPE html>

<style>
    *{
        padding: 0;margin: 0;box-sizing: border-box;
    }
    header{
        background-color:orange;
    }
    h1{
        color:white;
        padding:4px;
        text-align:center;
        font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif
    }
    .main{
        width:100%;
        height:235px;
        background-color:  gainsboro;
        position: relative;
        margin:10% auto;
        overflow: hidden;
        padding:15px;
        z-index: 1;
    }
    .box{
        width:200px;
        height:200px;
        box-shadow: 0px 0px 10px 4px white;;
        position: absolute;
        left: 100%;
        animation: scroll 10s linear 5;
        overflow: hidden;
        border-radius: 10px;;
    }
    img{
        width:100%;
        height:100%;
        background-size: cover;
        transform: scale(1.2);
    }
    .a1{animation-delay: calc(10s / 6 * (6 - 1 ) * -1);}
    .a2{animation-delay: calc(10s / 6 * (6 - 2 ) * -1);}
    .a3{animation-delay: calc(10s / 6 * (6 - 3 ) * -1);}
    .a4{animation-delay: calc(10s / 6 * (6 - 4 ) * -1);}
    .a5{animation-delay: calc(10s / 6 * (6 - 5 ) * -1);}
    .a6{animation-delay: calc(10s / 6 * (6 - 6 ) * -1);}
    /*.a7{animation-delay: calc(10s / 8 * (8 - 1 ));} */
    @keyframes scroll {
        to{
            left:-300px;
        }
    }

    /* main1  Css */
    .main1{
        width:40%;
        height:40%;
        border:10px double orangered;
        /* padding:10px; */
        display: flex;
        margin:10% auto;
        overflow-x: scroll;
        scroll-snap-type: x mandatory;
    }
    .box1{
        /* flex-basis: 200px; */
        width:100%;
        overflow: hidden;
        height:300px;
        flex-shrink: 0;
        scroll-snap-align: center;
    }
    .main1::-webkit-scrollbar{
        display: none;
    }

    /*  main2   */
    .main2{
        width:40%;
        height:40%;
        border:10px double orangered;
        /* padding:10px; */
        display: flex;
        margin:10% auto;
        overflow: hidden;
    }
    .box2{
        /* flex-basis: 200px; */
        width:100%;
        overflow: hidden;
        height:300px;
        flex-shrink: 0;
        scroll-snap-align: center;
        animation: scroll2 10s linear infinite;
    }
    @keyframes scroll2{
        to{
            transform: translate(-300%);
        }

    }
</style>
