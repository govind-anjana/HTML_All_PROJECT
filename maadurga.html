<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .main{
        height:96vh;
        /* background-image: url('https://wallpapers.com/images/high/nav-durga-red-fy06reuz7upajfqf.webp'); */
        background-color: black;
        padding-top:20px;
        overflow: hidden;
        background-size: cover;
    }
    .nav{
        backdrop-filter: blur(5px);
        width:750px;
        height:750px;
        /* border:2px solid red; */
        border-radius: 50%;
        /* background-color: rgb(185, 167, 167); */
        margin: auto;;
        animation: maa 10s linear infinite reverse;
    }
    .box {
        width:150px;
        height:150px;
        border-radius: 50%;;
        position: relative;
        overflow: hidden;
        box-shadow: 0px 0px 10px 4px white;
        /* animation: rotate 500s linear reverse; */
        
    }
    .box img{
        width:100%;
        height:100%;
        /* background-size: cover; */
        border-radius: 50%;
        /* transform: scale(1.6); */
    }
    @keyframes maa {
        from{
            transform: rotate(360deg);
        }
    }
    
    .a1{
        top:10px;
        left:370px;
    }
    .a2{
        /* position: absolute; */
        top:-30px;
        left:540px;
    }   
    .a3{      
        top:20px;
        left:590px;
    }
    .a4{      
        top:50px;
        left:500px;
    }
    .a5{      
        top:-20px;
        left:300px;
    } .a6{      
        top:-230px;
        left:110px;
    } .a7{      
        top:-540px;
        left:0px;
    }.a8{      
        top:-880px;
        left:40px;
    }.a9{      
        top:-1170px;
        left:170px;
    }
    
    .boxs{
        background-color: white;
        color:red;
        padding:3px 20px;
        position: absolute;
        top:47%;
        left:41%;
        text-transform: capitalize;
        height:60px;
        border-radius: 20px;
        overflow: hidden;
        text-align: center;
        z-index: 1;
    }
    .names{
        font-size: 23px;
        line-height: 60px;font-weight: 600;font-family: sans-serif;
    }
    .names:first-child{
        animation: govind 10s infinite;
    } 
    @keyframes govind{
         0%{margin-top: 0px;}
        15%{margin-top: -60px; }
        25%{margin-top: -120px;}
        35%{margin-top: -180px;}
        45%{margin-top: -240px; }
        55%{margin-top: -300px;}
        65%{margin-top: -360px;}
        75%{margin-top: -420px;}
        85%{margin-top: -480px;}
        100%{margin-top: -540px;}
         
    }
</style>
<body>
    <div class="main">
        <div class="boxs">
            <div class="names">Daughter of Mountain</div>
            <div class="names">Mother of Devotion</div>
            <div class="names">Destroyer of Demons</div>
            <div class="names">Goddess of Cosmic Egg</div>
            <div class="names">Goddess of Motherhood</div>
            <div class="names">Goddess of Power</div>
            <div class="names">Kalaratri </div>
            <div class="names">Mahagauri Mata</div>
            <div class="names">Siddhidatri Mata</div>
            </div>
        <div class="nav">
            <div class="box a1"><img src="https://blog.yatradham.org/wp-content/uploads/2022/09/Maa-Shaila-Putri.jpg"></div>
            <div class="box a2"><img src="https://blog.yatradham.org/wp-content/uploads/2022/09/Maa-Brahmacharini-1024x538.jpg"></div>
            <div class="box a3"><img src="https://blog.yatradham.org/wp-content/uploads/2022/09/Chandraghanta-1.jpg"></div>
            <div class="box a4"><img src="https://blog.yatradham.org/wp-content/uploads/2022/09/Maa-Kushmanda.jpg"></div>
            <div class="box a5"><img src="https://blog.yatradham.org/wp-content/uploads/2022/09/Maa-Skandamata.jpg"></div>
            <div class="box a6"><img src="https://blog.yatradham.org/wp-content/uploads/2022/09/Maa-Katyayani.jpg"></div>
            <div class="box a7"><img src="https://blog.yatradham.org/wp-content/uploads/2022/09/Maa-Kalaratri.jpg"></div>
            <div class="box a8"><img src="https://blog.yatradham.org/wp-content/uploads/2022/09/Maa-Mahagauri.jpg"></div>
            <div class="box a9"><img src="https://blog.yatradham.org/wp-content/uploads/2022/09/Maa-Siddhidatri.jpg"></div>
        

        </div>
    </div>
</body>
</html>
