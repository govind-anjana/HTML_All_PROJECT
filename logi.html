<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *
        {
        margin:0px;
        padding:0px;
    }
   .input
   {
    position:relative;
    width:250px;
    margin:3% 10%;
    border-bottom: 5px solid black;
 
   }
label{
    position:absolute;
    top:16px;
    left:1px;
    transform:translateY(-50%);
    color:red;
    font-size: 22px;;

}
.text:focus~label,
.text:focus~:valid
{
    top:-10px;
}
input[type="text"]
{
    width:100%;
    height:30px;
    background-color:silver;
    border:none;
    outline:none;
    font-size:20px;
 
}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="input">
        <input type="text" class="text">
        <label>Email</label>
    </div>
    <div class="input">
        <input type="text" class="text">
        <label>Email</label>
    </div>
</body>
</html>
