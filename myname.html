<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
         width:500px;
         height:40px;
         background-color: blueviolet;
         border-radius: 20px;
         position:absolute;
         overflow: hidden;
         
    }
   .line{
    width:100px;
    height:40px;
    border-radius:20px;
    background-color: cadetblue;
    position: absolute;
    animation: govind 5s linear 1 forwards;
    /* animation: name du.><ration timing-function delay iteration-count direction fill-mode;  */
   }
   @keyframes govind{
    to{
        width:500px;
     background-color: blue; 
     content: "go";
    }
   }
</style>
<body>
    <div class="box"> </div>
    <div class="line"> </div>
</body>
</html>
