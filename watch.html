<html>
<html lang="en">
<head>
    <style>
        *{
            margin: 0%;
            padding: 0%;

        }
        .containtor{
            width:100%;
            height:100vh;
            background-image: url(image3.jpg);
            background-size: cover;
            /* background-color: aqua; */
            display:flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
main{
    width:33%;
    height:auto;
     background-color:transparent;
    border-radius: 10px;
    box-shadow: 0px 0px 24px 10px white;
    cursor: pointer;
    backdrop-filter: blur(5px);
}
h2{
    color:white;
    font-family: sans-serif;
    margin:10px 0;
}
span{
    
    padding:3px 5px;
    font-size: 50px;
    font-weight: 600;
    color:white;
    background-color: black;
    border: 2px solid white;
    margin:10px;
    border-radius: 10px;    
}
input[type="text"]{
    width:63%;
    padding:4px 0px 4px 75px;
    font-size: 30px;
    outline: none;
    color:red;
    margin-top: 26px;
    margin-bottom: 26px;
    font-weight: 600;
    font-style: italic;
    color:black
}
.day span{
    display:inline-block;
    padding:3px 5px;
    font-size: 44px;
    font-weight: 600;
    margin-bottom: 30px;
}
.dmy label{
    display: inline-block;
    margin-top: 3px;
    padding:3px 7px;
    background-color:transparent;
    font-size: 26px;
    color:white;
    font-weight: 600;
    
}
.dmy .da{
    margin-right:10px;
}
.dmy .mo{
    margin-right:18px;
}
.dmy .ye{
    margin-right:37px;
}
    </style>
    <title>Document</title>
</head>
<body>
        <div class="containtor">
            <main>
                <h2>A Complte Watch</h2><br>
                <span class="year" >02</span>
                <span class="year" >03</span>
                <span class="year" >2024</span>
                <br>
                <div class="dmy">
                    <label class="da">Date</label>
                    <label class="mo">Month</label>
                    <label class="ye">Year</label>
                </div>
                <input type="text" placeholder="Time" readonly id="time">
                <div class="day">
                <span class="year">Satur</span>
                <span class="year">18 c</span>
                </div>
            </main>
        </div>
    </body>
   <script>
    const time=document.querySelector('#time');
    const year=document.querySelectorAll(".year");
    const day=["Sunday","Monday","Tuesday","Webnesday","Thursday","Friday","Saturday"]
  const watchs=()=>{
        const d=new Date();
        times= d.toLocaleTimeString();
        time.value=times;
                 date=d.getDate()
                 month=d.getMonth()+1;
                 date=date<=9?"0"+date:date;
                 month=month<=9?"0"+month:month;
                    year[0].innerText=date;
                    year[1].innerText=month;
                    year[2].innerText=d.getFullYear();
                    year[3].innerText=day[d.getDay()];
                }
     setInterval(()=>{
        watchs()
     },1000);


     //Api
     const p=fetch("https://goweather.herokuapp.com/weather/in");
    p.then((response)=>{
        console.log(this.response);
        return response.json();
    }).then((temp)=>{
       year[4].innerHTML=temp.temperature;
    })  
  </script>
</html>
