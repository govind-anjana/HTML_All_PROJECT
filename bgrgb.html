<!DOCTYPE html>
<html lang="en">
<head>
     <style>
         .containtor
         {
            height:95vh;
            background-color:transparent;
            display: flex;
            justify-content: center;
            align-items: center;
         }
         .center{
            width:30%;
            height:auto;
            background-color:black;
            padding:20px;
            border-radius: 19px;
            box-shadow: 0px 0px 10px 10px white;;
         }
         input[type="text"]{
            width:70%;
            font-size: 28px;
            border:none;    
            outline: none;
            padding:2px 10px;
            font-weight: 700;
            border-radius: 10px;
            
         }
         input[type="range"]{
            width:110%;
            accent-color: purple;
               
         }
         td:nth-child(1){
            font-size: 25px;
            color:white;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: 700;
         }
     </style>
    <title>Document</title>
</head>
<body onload="demo()">
    <div class="containtor">
        <div class="center">
            <table cellspacing="10px">
                <tr>
                    <td width="90px">Red : </td>
                    <td width="130px"><input type="text" class="text1"></td>
                    <td  ><input type="range" id="red" onchange="demo()" min="0" max="256"></td>
                </tr>
                <tr>
                    <td>Green : </td>
                    <td><input type="text" class="text1"></td>
                    <td><input type="range" id="green" onchange="demo()"  min="0" max="256"></td>
                </tr>
                <tr>
                    <td>Blue : </td>
                    <td><input type="text" value="20" class="text1"></td>
                    <td><input type="range" id="blue" onchange="demo()"  min="0" max="256"></td>
                </tr>
            </table>
        </div>
    </div>
</body>
<script>
    const texts=document.querySelectorAll(".text1");
    function demo(){
        let red=document.getElementById("red").value
        let green=document.getElementById("green").value
        let blue=document.getElementById("blue").value;
        texts[0].value=red;
        texts[1].value=green;
        texts[2].value=blue;
        to=`#${red}${green}${blue}`;
         console.log(to);
         document.body.style.backgroundColor=to;
    }
</script>
</html>
