<html>
<head>
<style>
body
{
background-image:radial-gradient(orange,pink,green);
}
.a
{
width:40%;
height:50px;
background-color:pink;
text-transform:uppercase;
border-radius:20px;
margin:auto;
margin-top:240px;
transition:3s;
box-shadow:4px 4px 5px 6px black,-4px -4px 5px 6px black;

}
p
{
font-size:45px;
font-weight:bold;
text-align:center;
color:white;
letter-spacing:3px;
font-style:italic;
font-family:ca;
animation:govind 4s linear infinite 5s;
}
@keyframes govind
{
0%{color:black;}
25%{color:silver;}
50%{color:orange;}
75%{color:green;}
100%{color:red;}
}
.a:hover
{
transform:rotate(360deg);
}
</style>
</head>
<body>
<div class="a">
<p>govind anjana</p>
</div>
</body>
</html>
