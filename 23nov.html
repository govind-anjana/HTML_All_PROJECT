<html>
<head>
<style>
.center
{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%);
}
input[type="checkbox"]
{
position:relative;
width:80px;
height:40px;
background:silver;
border-radius:20px;
transition:2s;
}
input:checked[type="checkbox"]
{
background:blue;
}
input[type="checkbox"]:before
{
content:'';
position:absolute;
width:40px;
height:40px;
border-radius:20px;
background:white;
transform:scale(1.1);
}
input:checked[type="checkbox"]:before
{
left:40px;
}
</style>
</head>
<body>
<div class="center">
<input type="checkbox" class="chechbox">
</div>
</body>
</html>
