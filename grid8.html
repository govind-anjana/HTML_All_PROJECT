<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            border:2px solid red;
            width:80vw;
            padding:10px;
            gap:10px;
            margin:auto;
            display: grid;
            grid-template-columns: repeat(4,auto);
            grid-auto-rows: minmax(80px,auto);
        }
        .box{
            border:2px solid pink;
            background-color: gray;
            color:white;
            font-size: 30px;
            display: flex;
        justify-content: center;
        align-items: center;
        }
        .box:nth-child(1){grid-column: span 2;}
        .box:nth-child(4),.box:nth-child(5),.box:nth-child(6){grid-column: span 1;}
        .box:nth-child(7){grid-column: span 2;grid-row: span 2;}
        .box:nth-child(8){grid-column: span 1;}
        .box:nth-child(9){grid-column: span 1;}
        .box:nth-child(10){grid-column: span 1;}
        .box:nth-child(11){grid-column: span 3;}

        /* .box:nth-child(1){grid-column: span 12;}
        .box:nth-child(2),.box:nth-child(3){grid-column: span 6;}
        .box:nth-child(4),.box:nth-child(5),.box:nth-child(6){grid-column: span 4;}
        .box:nth-child(7),.box:nth-child(8),.box:nth-child(9),.box:nth-child(10){grid-column: span 3;}
        .box:nth-child(11),.box:nth-child(12),.box:nth-child(13),.box:nth-child(14),.box:nth-child(15),.box:nth-child(16){grid-column: span 2;}

    
    */
    </style>
</head>
<body>
    <div id="main">
        <div class="box a1">A</div>
        <div class="box a2">B</div>
        <div class="box a3">C</div>
        <div class="box a4">D</div>
        <div class="box a5">E</div>
        <div class="box a6">F</div>
        <div class="box a7">G</div>
        <div class="box a8">H</div>
        <div class="box a9">I</div>
        <div class="box a10">J</div>
        <div class="box a11">K</div>
        <div class="box a12">L</div>
        <div class="box a13">M</div>
    </div>
</body>
</html>
