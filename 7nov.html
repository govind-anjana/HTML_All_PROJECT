<html>
    <head>
        <style>
            .a
            {
                width:70%;
                height: 50%;
                background-color: aqua;

            }
			#a{
			width:30%;
			background-color:silver;
			font-size:20px;
			font-weight:bold;
			}
		#b{
			width:30%;
			background-color:silver;
			font-size:20px;
			font-weight:bold;
			}
			.ans
			{
			width:90%;
			height:30%;
			background-color:black;
			margin:10px 30%;	
			}
        </style>
    </head>
       <body>
        <div class="a">
		
<input type="text" onblur="first()" id="a"  placeholder="My Message"></textarea>
<input type="text" onblur="second()" id="b"  placeholder="My Receriver"></textarea>
<div id="ans" class="ans"  readonly></div>
        </div>
       </body>
	   <script>
	   function first()
	   {
	  var a= document.getElementById("a").value;
	 var b= document.getElementById("ans").innerHTML;
	 document.getElementById("ans").style.color="red";
	 document.getElementById("ans").style.textAlign="left";
	 document.getElementById("ans").innerHTML=(b+'<br/>'+a);
	 document.getElementById("a").value="";
	 
	   }
	    function second()
	    {
	  var c= document.getElementById("b").value;
	 var d= document.getElementById("ans").innerHTML;
	 document.getElementById("ans").style.color="blue";
	 document.getElementById("ans").style.textAlign="right";
	 document.getElementById("ans").value=innerHTML=(d+'<br/>'+c);
	 document.getElementById("b").value="";
	 
	   }
	   </script>
</html>
