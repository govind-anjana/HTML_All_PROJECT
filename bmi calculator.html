<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .div{
            width:30%;
            height:auto;
            background-color: silver;
            padding:10px;
            margin:auto;
            margin-top:10%;
            font-weight: 700;
        }
        input{
            width:70px;
            font-size: 14px;
            padding:3px;
            margin-left:10px;
            margin-top:30px;
        }
        input[type="submit"]{
            width:110px;
            font-size: 20px;
           background-color: white;
            color:black;
            padding:5px;
             position: relative;
             left:130px;
             cursor: pointer;
             border-radius: 10px;
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="div">
        <h3>BMI Calculator</h3>
        <label>Enter The Height Of CM</label>
        <input type="number" id="cm"><br>
        <label>Enter The Width Of KG</label>
        <input type="number" id="kg"><br>
        <input type="submit" value="Calculator" onclick="demo()">
        <div id="ans"></div>
    </div>
</body>
<script>
    const go=document.querySelector("#ans");
    function demo(){
   const height= eval(document.getElementById("cm").value);
   const width= parseInt(document.getElementById("kg").value);
    
   if(height==='' || height<0 || isNaN(height)){
    to="Place Give a Valid Height";
    go.innerHTML=to;
   }else if(width==='' || width<0 || isNaN(width)){
    to="Place Give a Valid width";
    go.innerHTML=to;
   }
      else {
        total =(width/((height**2)/10000)).toFixed(3)
        
        //total=(width/((height*height)/10000)).toFixed(2);
        if(total<=18.6){
            go.innerHTML=`Under Width  ${total}`;
        }
        else  if(total>=18.6 && total<=24.9){
            go.innerHTML=`Normal Range  ${total}`;
        }
      else{
            go.innerHTML=`Over Width  ${total}`;
        }
         
      }         
    }
</script>
</html>
