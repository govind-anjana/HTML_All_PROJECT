<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *
        {
            padding:0px;
            margin:0px;
        }
        body{
            background-color: silver;
        }
        .first{
            width:30%;
            height:35vh;
            background-color: white;
            margin:auto;
            padding:8px;
            margin-top:10%;
            
        }
        input[type="date"]
        {
            width:35%;
            height:30px;
            color:black;
            font-size: 20px;
            margin-left:60px;
            padding:5px;
            border-radius:10px;

        }
        button{
            width:27%;
            height:40px;
            background-color: brown;
            color:white;
           
            font-size: 20px;
            border:none;
            border-radius:20px;
        }
        #a{
            width:100%;
            height:20%;   
            font-size: 20px;
            color:rgb(0, 255, 34);
            font-weight: 900;
            padding:20px;
            text-align: center;
        
        }
        h3 {
            font-size: 30px;
            color:black;
            font-weight: bold;
            font-style: italic;
            padding:26px;
            text-align: center;
        }
        .ac{
            font-size: 22px;
            font-family: sans-serif;
            padding:110px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="first">
        <h3>Age Calculator</h3>
        <span class="ac">Enter Your Birthdate:</span><br>
        <input type="date" id="date" >
        <button onclick="demo()">Submit</button><br><br>
        <div id="a"></div>
        
    </div>
</body>
<script>
    function demo()
    {
      let x= document.getElementById("date").value;
      d=new Date(); 
      da=d.getDate();
      m=d.getMonth()+1;
      ye=d.getFullYear();
       

      y=new Date(x); 
    xda=y.getDate();
      xm=y.getMonth()+1;
      xye=y.getFullYear();
      //document.getElementById("date").value=xda/xm/xye;
     year= ye-xye;
   month= m-xm;
   date=Math.abs(da-xda);
   document.getElementById("a").innerHTML=`Your Age is ${year} Years, ${month} Months,and ${date} <br> days`;
    }
</script>
</html>
