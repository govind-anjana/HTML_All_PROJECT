<html>
<head>
<style>
h6{
font-size:60px;
color:black;
text-align:center;
margin-top:10%;
}
span{
font-size:60px;
color:red;
margin-top:35%;
font-weight:bold;
text-align:center;
letter-spacing:6px;
animation:govind 3s infinite 4s;
}
span:nth-child(odd){
    color:black;
}
span:hover
{
font-size:70px;
transform:4s 3  ;
}
@keyframes govind {
    
0%{color:blue;}
50%{color:orange;}
}
</style>
<body>
<h6>CSS TEXT GROP ANIMATION</h6>
<p style="text-align:center"><span>H</span><span>E</span><span>L</span><span>L</span><span>O</span></p>
</body>
</html>
