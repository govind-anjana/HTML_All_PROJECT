<!DOCTYPE html>
<html lang="en">
<head>

        *{

     ul li a{

        .go,.govin,.govind{

<script>
    function demo(){
      co= document.body.style.backgroundColor="silver";
    }
    function del(){
        co= document.body.style.backgroundColor="white";
