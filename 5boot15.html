<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(function(){
            $('[data-toggle="tooltip"]').tooltip({
                html:true,
                animation :false,
                delay:{"show":100,"hide":1000},
                placement:"top",
                trigger:"click",
                offset:30
            });
            
        });
    </script>
</head>
<body>
    <div class="container">
        <h4 class="text-center">Bootstrap Tooltips</h4>
        <div class="row py-4">
            <div class="col text-center">
                <button class="btn btn-primary " title="<h1>govind</h1>" dada-toggle="tooltip bg-danger">Button 1</button>



                <button class="btn btn-secondary" >Button 2</button>
                <button class="btn btn-success">Button 3</button>
                <button class="btn btn-info">Button 4</button>
            </div>
        </div>
    </div>
</body>
</html>
